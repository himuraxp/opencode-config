# Stale — Close inactive issues and PRs automatically
# https://github.com/actions/stale

name: Stale

on:
  schedule:
    - cron: "0 0 * * 1"  # Every Monday at 00:00 UTC

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          # Issues
          days-before-issue-stale: 30
          days-before-issue-close: 7
          stale-issue-label: stale
          stale-issue-message: >
            This issue has been inactive for 30 days and will be closed in 7 days.
            If it's still relevant, comment to keep it open.

          # Pull requests
          days-before-pr-stale: 30
          days-before-pr-close: 7
          stale-pr-label: stale
          stale-pr-message: >
            This PR has been inactive for 30 days and will be closed in 7 days.
            If it's still being worked on, comment to keep it open.

          # Misc
          exempt-issue-labels: pinned,security,enhancement
          exempt-pr-labels: pinned,security,dependencies
          operations-per-run: 30
